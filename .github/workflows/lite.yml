name: Notify Blog Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'src/content/posts/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Parse Markdown and Create Issues
        run: |
          TARGET_OWNER="kerzjz"
          TARGET_REPO="kerzjz.github.io"
          ARTICLES_DIR="src/content/posts"
          TEMP_BODY_FILE=$(mktemp)

          shopt -s nullglob
          for file in "${ARTICLES_DIR}"/*.md; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")

            # 解析 frontmatter
            title=$(sed -n '/^---$/,/^---$/p' "$file" | grep '^title:' | sed 's/^title:[[:space:]]*//;s/^"//;s/"$//;s/[[:space:]]*$//')
            category=$(sed -n '/^---$/,/^---$/p' "$file" | grep '^category:' | sed 's/^category:[[:space:]]*//;s/^"//;s/"$//;s/[[:space:]]*$//')
            tags_raw=$(sed -n '/^---$/,/^---$/p' "$file" | grep '^tags:' | sed 's/^tags:[[:space:]]*//')
            tags=$(echo "$tags_raw" | sed 's/\[//;s/\]//;s/"//g;s/,/,/g;s/^[[:space:]]*//')
            published=$(grep '^published:' "$file" | sed 's/^published:[[:space:]]*//')

            # 提取正文（frontmatter 之后的内容）
            body=$(awk '/^---$/{n++;next} n>=2' "$file")

            # 把 Issue 内容写入临时文件，完全避开 Shell 转义
            cat > "${TEMP_BODY_FILE}" << BODYEOF
            ## 文章元数据

            - **发布时间**：${published}
            - **分类**：${category}
            - **标签**：${tags}

            ---

            ## 正文

            ${body}
            BODYEOF

            # 构建 labels
            labels="${category}"
            if [ -n "$tags" ]; then
              labels="${labels},${tags}"
            fi

            # 用 --body-file 读取，彻底解决特殊字符问题
            gh issue create \
              --repo "${TARGET_OWNER}/${TARGET_REPO}" \
              --title "${title}" \
              --body-file "${TEMP_BODY_FILE}" \
              --label "${labels}" \

              || echo "⚠️ 创建 Issue 失败: ${filename}"

            echo "✅ 已提交 Issue: ${title}"
          done
          shopt -u nullglob
          rm -f "${TEMP_BODY_FILE}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
