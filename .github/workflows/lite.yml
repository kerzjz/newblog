name: Notify Blog Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'src/content/posts/**'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Parse Markdown and Create Issues
        run: |
          # 配置目标仓库（仓库B）
          TARGET_OWNER="kerzjz"
          TARGET_REPO="kerzjz.github.io"

          ARTICLES_DIR="src/content/posts"

          shopt -s nullglob
          for file in "${ARTICLES_DIR}"/*.md; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")

            # 解析 frontmatter 中的 title
            title=$(sed -n '/^---$/,/^---$/p' "$file" | grep '^title:' | sed 's/^title:[[:space:]]*//;s/^"//;s/"$//;s/[[:space:]]*$//')

            # 解析 category 作为标签
            category=$(sed -n '/^---$/,/^---$/p' "$file" | grep '^category:' | sed 's/^category:[[:space:]]*//;s/^"//;s/"$//;s/[[:space:]]*$//')

            # 解析 tags 数组
            tags_raw=$(sed -n '/^---$/,/^---$/p' "$file" | grep '^tags:' | sed 's/^tags:[[:space:]]*//')
            # 将 ["tag1", "tag2"] 格式转为逗号分隔（逗号后不加空格，gh 才能正确拆分）
            tags=$(echo "$tags_raw" | sed 's/\[//;s/\]//;s/"//g;s/,/,/g;s/^[[:space:]]*//')

            # 提取正文内容（frontmatter 之后的部分）
            body=$(sed '1,/^---$/d' "$file" | sed '1,/^---$/d')

            # 构建 Issue 内容
            issue_body="## 文章元数据

- **发布时间**：$(grep '^published:' "$file" | sed 's/^published:[[:space:]]*//')
- **分类**：${category}
- **标签**：${tags}

---

## 正文

${body}"

            # 构建 labels（category + tags）
            labels="${category}"
            if [ -n "$tags" ]; then
              labels="${labels},${tags}"
            fi

            # 调用 GitHub API 创建 Issue
            gh issue create \
              --repo "${TARGET_OWNER}/${TARGET_REPO}" \
              --title "${title}" \
              --body "${issue_body}" \
              --label "${labels}" \

              || echo "⚠️ 创建 Issue 失败: ${filename}"

            echo "✅ 已提交 Issue: ${title}"
          done
          shopt -u nullglob
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
