name: Notify‑New‑Post

on:
  push:
    branches: [ main ]
    paths:
      - 'src/content/posts/**/*.md'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: kerzjz/newblog

      - name: Detect changed post files
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          CHANGED=""
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
              # 手动调试：读取全部文章
              CHANGED=$(git ls-files 'src/content/posts/**/*.md' || true)
          elif [ "${BEFORE}" = "0000000000000000000000000000000000000000" ]; then
              CHANGED=$(git ls-files 'src/content/posts/**/*.md' || true)
          else
              CHANGED=$(git diff --name-only --diff-filter=ACMR "${BEFORE}" "${AFTER}" -- 'src/content/posts/' || true)
          fi

          # 过滤掉 talk 目录
          CHANGED=$(echo "$CHANGED" | grep -v '^src/content/posts/talk/' || true)

          if [ -z "$CHANGED" ]; then
            echo "changed=" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "changed<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Send issue comment
        if: steps.detect.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = `${{ steps.detect.outputs.changed }}`.split(/\r?\n/).filter(Boolean);
            const messages = [];
            for(const f of files){
                const raw = fs.readFileSync(f,'utf8');
                const titleMatch = raw.match(/^title:\s*(.+)/m);
                const title = titleMatch ? titleMatch[1] : '无标题';
                const slug = f.replace('src/content/posts/','').replace('.md','');
                messages.push(`✅ 新文章发布：**${title}**\nhttps://yoursite/posts/${slug}`);
            }
            await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 6,
                body: messages.join('\n\n')
            })
